[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firstmatch"
version = "0.1.0"
description = "Say which line of your ssh config actually won, and name the lines that never will."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ssh", "ssh-config", "openssh", "linter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
firstmatch = "firstmatch.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/firstmatch"

[tool.hatch.build.targets.wheel]
packages = ["src/firstmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes only, matching the rest of the org (see logbook#36). These are the
# rules about code that cannot be right.
select = ["F"]
